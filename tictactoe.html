<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe</title>

<style>
body{
    margin:0;
    background:#121212;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#ffcc00;
    font-size:45px;
}

#status{
    font-size:25px;
    margin:20px;
}

.board{
    width:330px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.cell{
    height:100px;
    background:#333;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    border-radius:10px;
}

button{
    margin-top:25px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#ffcc00;
}

</style>
</head>

<body>

<h1>Tic Tac Toe</h1>

<div id="status">Player X Turn</div>

<div class="board">
<div class="cell" onclick="play(0)"></div>
<div class="cell" onclick="play(1)"></div>
<div class="cell" onclick="play(2)"></div>

<div class="cell" onclick="play(3)"></div>
<div class="cell" onclick="play(4)"></div>
<div class="cell" onclick="play(5)"></div>

<div class="cell" onclick="play(6)"></div>
<div class="cell" onclick="play(7)"></div>
<div class="cell" onclick="play(8)"></div>
</div>

<button onclick="restart()">Restart</button>


<script>

let cells=document.querySelectorAll(".cell");

let board=[
"","","",
"","","",
"","",""
];

let player="X";
let game=true;


function play(i){

if(board[i]!="" || game==false)
return;

board[i]=player;
cells[i].innerHTML=player;

check();

if(game){
player = player=="X" ? "O" : "X";

document.getElementById("status").innerHTML=
"Player "+player+" Turn";
}

}


function check(){

let win=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];


for(let w of win){

let a=w[0];
let b=w[1];
let c=w[2];

if(board[a] &&
board[a]==board[b] &&
board[b]==board[c]){

document.getElementById("status").innerHTML=
"Player "+board[a]+" Wins!";

game=false;
return;

}

}


if(!board.includes("")){

document.getElementById("status").innerHTML="Draw!";

game=false;

}

}


function restart(){

board=[
"","","",
"","","",
"","",""
];

player="X";
game=true;

cells.forEach(cell=>{
cell.innerHTML="";
});

document.getElementById("status").innerHTML=
"Player X Turn";

}

</script>

</body>
</html>
